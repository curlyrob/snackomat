# Baut die Website und die Automaten-Kacheln und veröffentlicht beides auf GitHub Pages.
# Läuft bei jeder Änderung an der Website, jeden Montag früh (frische OSM-Daten) und auf Knopfdruck.
name: Website und Automatendaten

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: osmium installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Deutschland-Auszug von Geofabrik laden
        run: |
          UA="snackomat-data-build (+https://github.com/curlyrob/snackomat)"
          curl -fsSL -A "$UA" -o germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          curl -fsSL -A "$UA" -o germany.poly https://download.geofabrik.de/europe/germany.poly
          ls -lh germany.osm.pbf

      - name: Automaten herausfiltern
        run: |
          osmium tags-filter germany.osm.pbf nwr/amenity=vending_machine -o vending.osm.pbf
          osmium export vending.osm.pbf -f geojsonseq -a type,id \
            --geometry-types=point,linestring,polygon -o vending.geojsonseq

      - name: Website und Kacheln zusammenstellen
        run: |
          mkdir -p _site
          cp *.html style.css icon.png _site/
          python3 tools/build_tiles.py vending.geojsonseq germany.poly _site/data/v1
          du -sh _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
